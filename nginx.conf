# Sitio 100 % estático. Se copia a /etc/nginx/conf.d/default.conf en la imagen.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Redirecciones relativas: correcto detrás del proxy de Dokploy (Traefik).
    absolute_redirect off;

    # Copia de pruebas (curia2): ningún buscador debe indexarla. Quitar al pasar a producción.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Todo es propio: sin terceros, sin estilos ni scripts en línea, y el formulario no hace peticiones.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    # HTML siempre revalidado; los assets llevan ?v=huella y se pueden cachear.
    expires -1;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }
}
